name: smoke test

# Fresh install on three operating systems, download the released final system, run it on the CPU.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install PyTorch (CPU build)
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            pip install torch==2.6.0
          else
            pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          fi
      - name: Install requirements
        run: pip install -r requirements.txt
      - name: Download the final system (GitHub Release)
        run: python scripts/download_assets.py
      - name: Smoke test
        run: python tests/smoke_test.py
